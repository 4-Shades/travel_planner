name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No stored cloud keys (TP-SRS-185). Jobs that later need cloud access add
# `id-token: write` and authenticate through OpenID Connect federation.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and service tests
        run: pytest tests
      - name: BDD scenarios
        # Exit code 5 means no scenarios were collected; allowed until phase 3 binds the first feature.
        run: pytest features -m "not demonstration and not deployment" || [ $? -eq 5 ]

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
