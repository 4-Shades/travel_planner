name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No stored cloud keys (TP-SRS-185). Jobs that later need cloud access add
# `id-token: write` and authenticate through OpenID Connect federation.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 for Docker (TP-SRS-161); 3.12 for Vercel, which has no 3.11 (docs/DEPLOYMENT.md).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - run: pip install -r requirements/requirements-dev.txt
      - name: Unit and service tests
        run: pytest tests
      - name: BDD scenarios
        run: pytest features -m "not demonstration and not deployment"
      - name: Docker Compose configuration
        run: docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: BDD scenarios
        run: npm run test:bdd

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
