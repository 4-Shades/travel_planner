[project]
name = "travel-planner"
version = "1.0.0"
description = "ADK-Powered Travel Planner: a Host agent and three specialist agents behind a Next.js web application"
# Docker and CI run 3.11 (TP-SRS-161); Vercel runs 3.12, its oldest Python (see docs/DEPLOYMENT.md).
requires-python = ">=3.11"
# The agents' runtime dependencies, as in requirements/requirements.in. Vercel installs from here.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "numpy==2.4.6",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[tool.uv]
# Every version in requirements/requirements.txt, so that the lock Vercel makes with "uv lock"
# has exactly the pinned versions (TP-SRS-166). tests/test_repository.py checks they agree.
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "fastapi==0.162.0",
    "googleapis-common-protos==1.76.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "numpy==2.4.6",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-http-transport==0.66b1",
    "opentelemetry-exporter-otlp-common==0.66b1",
    "opentelemetry-exporter-otlp-proto-common==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-proto==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-semantic-conventions==0.66b1",
    "protobuf==7.36.2",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "requests==2.34.2",
    "starlette==1.10.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No test may reach a real external service (TP-SRS-187).
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
bdd_features_base_dir = "features/"
markers = [
    "web: BDD scenario run by playwright-bdd against the web application",
    "api: BDD scenario against an agent's HTTP API",
    "host: BDD scenario against the Host",
    "specialist: BDD scenario against a specialist agent",
    "rag: BDD scenario about guidance retrieval",
    "ingest: BDD scenario about the ingest command",
    "metrics: BDD scenario about metrics export",
    "demonstration: run by hand against a deployment; excluded from CI",
    "deployment: run by hand against a deployment; excluded from CI",
    "requirement(id): the SRS requirement a BDD scenario verifies, from its @TP-SRS-nnn tag",
]
